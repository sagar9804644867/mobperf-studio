# File extensions that are static assets (usually served by a CDN, cached by the app).
static_extensions: [.png, .jpg, .jpeg, .gif, .webp, .svg, .ico, .css, .js, .woff, .woff2, .ttf, .otf, .mp4, .mp3, .m3u8, .ts, .map]

# HTTP methods never scripted.
skip_methods: [OPTIONS, CONNECT]
