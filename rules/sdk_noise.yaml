# Traffic that mobile SDKs generate on their own. It is not part of the business
# journey under test, so it is excluded from the script by default.
# Each entry is matched as a host suffix ("googleapis.com" also matches "a.b.googleapis.com").
# Edit freely, or override from the Streamlit UI.

